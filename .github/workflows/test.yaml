name: Test
"on":
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - run: npm install -g corepack@latest && corepack enable
      - name: "Use Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
